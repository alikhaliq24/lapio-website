name: lapio-website
region: nyc
services:
  - name: web
    github:
      repo: alikhaliq24/lapio-website
      branch: main
      deploy_on_push: true
    build_command: npm install
    run_command: npm start
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    envs:
      - key: HUBSPOT_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_YOUR_TOKEN
